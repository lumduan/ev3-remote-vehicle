[project]
name = "ev3-remote-vehicle"
version = "0.1.0"
description = "Host tooling for a Bluetooth-gamepad-controlled LEGO MINDSTORMS EV3 vehicle running ev3dev"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# HOST dependencies only. Nothing here is ever installed on the brick.
# Code under agent/ runs on the EV3's own Python 3.5 with the standard
# library and nothing else. See CLAUDE.md, "Two runtimes".
dependencies = [
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
ev3ctl = "ev3ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit, not auto-discovered. agent/ is not a package and must never
# be picked up by the build; it is source that gets copied to the brick.
packages = ["src/ev3ctl"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]

# One ruff configuration covers both runtimes deliberately. E, F and W
# are pycodestyle and pyflakes; none of them is sensitive to the target
# Python version, so the same rules are correct for CPython 3.12 under
# src/ and CPython 3.5 under agent/. The 3.5 restrictions that ruff
# cannot express - no f-strings, no dataclasses, no walrus - are stated
# in agent/README.md and enforced by review.
